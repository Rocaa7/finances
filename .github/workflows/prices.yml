name: Preus
on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:
  push:
    paths: [isins.txt]
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 prices.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Preus actualitzats" && git push)
